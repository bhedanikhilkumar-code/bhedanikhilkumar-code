<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nikhil Bheda — Engineering Focus</title>
  <desc id="desc">Four connected engineering areas: full-stack products, Flutter apps, AI and automation, and cybersecurity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560"><stop stop-color="#030712"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="line" x1="160" y1="280" x2="1040" y2="280"><stop stop-color="#22D3EE"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#3B82F6" stop-opacity="0.2"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/></filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94A3B8" opacity="0.12"/></pattern>
    <style>@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 4s ease-in-out infinite}</style>
  </defs>
  <rect width="1200" height="560" rx="30" fill="url(#bg)"/><rect width="1200" height="560" rx="30" fill="url(#dots)"/><circle cx="600" cy="250" r="330" fill="url(#glow)"/>
  <rect x="28" y="28" width="1144" height="504" rx="24" stroke="#334155" stroke-opacity="0.6"/>

  <text x="600" y="75" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="850">Engineering Focus</text>
  <text x="600" y="105" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Four lanes. One goal: build useful, reliable software.</text>

  <path d="M280 250H920M600 170V390" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle class="pulse" cx="600" cy="280" r="64" fill="#030712" stroke="#38BDF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="274" text-anchor="middle" fill="#67E8F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">BUILD</text>
  <text x="600" y="298" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">PRODUCTS</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="390" height="145" rx="22" fill="#0B1120" stroke="#22D3EE" stroke-opacity="0.4"/>
    <text x="100" y="185" fill="#67E8F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">01  Full-Stack</text>
    <text x="100" y="216" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">React · TypeScript · Node.js · APIs</text>
    <text x="100" y="246" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Dashboards, workflows & data-driven products</text>
    <text x="100" y="270" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">ExporTrack AI · Planora</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="145" width="390" height="145" rx="22" fill="#0B1120" stroke="#8B5CF6" stroke-opacity="0.4"/>
    <text x="770" y="185" fill="#C4B5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">02  Flutter</text>
    <text x="770" y="216" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Dart · Provider · Hive · Firebase</text>
    <text x="770" y="246" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Mobile utilities with practical offline-first UX</text>
    <text x="770" y="270" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Site Surveyor Compass</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="350" width="390" height="145" rx="22" fill="#0B1120" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="100" y="390" fill="#93C5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">03  AI & Automation</text>
    <text x="100" y="421" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Python · FastAPI · AI workflows</text>
    <text x="100" y="451" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Automate repetitive work and build smarter tools</text>
    <text x="100" y="475" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">AutoPortfolio Builder</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="350" width="390" height="145" rx="22" fill="#0B1120" stroke="#A78BFA" stroke-opacity="0.4"/>
    <text x="770" y="390" fill="#C4B5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">04  Security</text>
    <text x="770" y="421" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Linux · Secure development · Forensics</text>
    <text x="770" y="451" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Learning systems, testing responsibly, reducing risk</text>
    <text x="770" y="475" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Security-aware engineering</text>
  </g>
</svg>
