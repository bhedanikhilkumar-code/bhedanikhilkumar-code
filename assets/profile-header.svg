<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nikhil Bheda — Software Engineer Profile</title>
  <desc id="desc">Modern dark developer profile banner with a code-inspired visual, technology focus, and engineering message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/><stop offset="0.52" stop-color="#0B1120"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 100) rotate(130) scale(430 330)">
      <stop stop-color="#2563EB" stop-opacity="0.28"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#64748B" stroke-opacity="0.09"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/></filter>
    <style>
      @keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes pulse {0%,100%{opacity:.45}50%{opacity:1}}
      .card{animation:float 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 4s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="30" fill="url(#glow)"/>
  <rect x="28" y="28" width="1144" height="364" rx="24" stroke="#334155" stroke-opacity="0.5"/>
  <rect x="28" y="28" width="1144" height="4" rx="2" fill="url(#accent)"/>

  <g class="card" filter="url(#shadow)">
    <rect x="72" y="76" width="650" height="268" rx="26" fill="#0B1120" fill-opacity="0.9" stroke="#334155"/>
    <text x="108" y="120" fill="#67E8F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">SOFTWARE ENGINEERING • AI • SECURITY</text>
    <text x="108" y="188" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="850" letter-spacing="-2">Nikhil Bheda</text>
    <rect x="110" y="207" width="320" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="108" y="252" fill="#E0F2FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Full-Stack Developer • Flutter Builder</text>
    <text x="108" y="286" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">I turn ideas into practical products — from UI and APIs</text>
    <text x="108" y="312" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">to automation, debugging, documentation, and deployment.</text>
  </g>

  <g class="card" filter="url(#shadow)" style="animation-delay:1.2s">
    <rect x="760" y="76" width="368" height="268" rx="26" fill="#030712" fill-opacity="0.92" stroke="#334155"/>
    <circle cx="796" cy="110" r="6" fill="#F87171"/><circle cx="818" cy="110" r="6" fill="#FBBF24"/><circle cx="840" cy="110" r="6" fill="#34D399"/>
    <text x="792" y="151" fill="#64748B" font-family="Cascadia Code,Consolas,monospace" font-size="15">developer.config</text>
    <text x="792" y="185" fill="#A5B4FC" font-family="Cascadia Code,Consolas,monospace" font-size="15">focus:</text>
    <text x="860" y="185" fill="#E2E8F0" font-family="Cascadia Code,Consolas,monospace" font-size="15">"Product Engineering"</text>
    <text x="792" y="219" fill="#A5B4FC" font-family="Cascadia Code,Consolas,monospace" font-size="15">stack:</text>
    <text x="860" y="219" fill="#E2E8F0" font-family="Cascadia Code,Consolas,monospace" font-size="15">React + Flutter</text>
    <text x="792" y="253" fill="#A5B4FC" font-family="Cascadia Code,Consolas,monospace" font-size="15">mindset:</text>
    <text x="792" y="279" fill="#E2E8F0" font-family="Cascadia Code,Consolas,monospace" font-size="15">Build → Debug → Improve</text>
    <text x="792" y="313" fill="#22D3EE" font-family="Cascadia Code,Consolas,monospace" font-size="15" font-weight="700">status: shipping 🚀</text>
    <circle class="pulse" cx="1100" cy="313" r="5" fill="#22D3EE"/>
  </g>
</svg>
