<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Bheda Nikhilkumar</title>
  <desc id="d">Computer Engineering student building full-stack, AI and security projects. Creator of the Dev Gyaan YouTube channel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/><stop offset="0.55" stop-color="#0F172A"/><stop offset="1" stop-color="#111C36"/>
    </linearGradient>
    <linearGradient id="acc" x1="70" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 90) scale(420 300)">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.30"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/></pattern>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .cursor{animation:blink 1.1s step-end infinite}
    </style>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" fill="none" stroke="#334155" stroke-opacity="0.6"/>

  <text x="72" y="92" class="sans" fill="#67E8F9" font-size="15" font-weight="700" letter-spacing="3">COMPUTER ENGINEERING · FULL-STACK · AI · SECURITY</text>
  <text x="70" y="160" class="sans" fill="#F8FAFC" font-size="60" font-weight="800" letter-spacing="-1.5">Bheda Nikhilkumar</text>
  <rect x="72" y="182" width="300" height="5" rx="2.5" fill="url(#acc)"/>
  <text x="72" y="228" class="sans" fill="#CBD5E1" font-size="22" font-weight="600">B.Tech Computer Engineering · Atmiya University, Rajkot</text>
  <text x="72" y="264" class="sans" fill="#94A3B8" font-size="19">I build practical software, debug what breaks, and ship the next version.</text>
  <text x="72" y="296" class="sans" fill="#94A3B8" font-size="19">Creator of <tspan fill="#F87171" font-weight="700">Dev Gyaan</tspan> · tech explained in Hindi.</text>

  <g transform="translate(810 82)">
    <rect width="320" height="186" rx="16" fill="#020617" fill-opacity="0.75" stroke="#334155"/>
    <circle cx="24" cy="22" r="6" fill="#F87171"/><circle cx="44" cy="22" r="6" fill="#FBBF24"/><circle cx="64" cy="22" r="6" fill="#34D399"/>
    <text x="24" y="66" class="mono" font-size="15" fill="#64748B">// loop.ts</text>
    <text x="24" y="96" class="mono" font-size="15"><tspan fill="#C084FC">while</tspan><tspan fill="#E2E8F0"> (curious) {</tspan></text>
    <text x="44" y="122" class="mono" font-size="15" fill="#67E8F9">learn(); build(); debug();</text>
    <text x="44" y="146" class="mono" font-size="15" fill="#67E8F9">improve(); share();<tspan class="cursor" fill="#F8FAFC"> ▍</tspan></text>
    <text x="24" y="170" class="mono" font-size="15" fill="#E2E8F0">}</text>
  </g>
