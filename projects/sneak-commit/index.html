<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sneak Commit</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050816; color: #f8fafc; }
    main { width: min(92vw, 760px); padding: 28px; border: 1px solid #24324a; border-radius: 24px; background: #0b1120; box-shadow: 0 24px 70px #0008; text-align: center; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3.5rem); }
    p { color: #94a3b8; }
    #game { position: relative; height: 420px; margin: 22px 0; overflow: hidden; border: 1px solid #334155; border-radius: 18px; background: radial-gradient(circle at center, #111c33, #050816); }
    #player, .commit { position: absolute; display: grid; place-items: center; border-radius: 12px; user-select: none; }
    #player { width: 48px; height: 48px; background: #22d3ee; color: #03121a; font-weight: 900; bottom: 22px; left: calc(50% - 24px); }
    .commit { width: 42px; height: 42px; background: #8b5cf6; color: white; font-size: 20px; }
    .hud { display: flex; justify-content: space-between; gap: 16px; font-weight: 800; }
    button { border: 0; border-radius: 12px; padding: 12px 18px; background: #2563eb; color: white; font-weight: 800; cursor: pointer; }
    button:hover { filter: brightness(1.15); }
    .hint { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 Sneak Commit</h1>
    <p>Dodge the incoming commits. Survive as long as you can.</p>
    <div class="hud"><span>Score: <span id="score">0</span></span><span>Best: <span id="best">0</span></span></div>
    <div id="game" aria-label="Sneak Commit game">
      <div id="player">&gt;_</div>
    </div>
    <button id="start">Start Game</button>
    <p class="hint">Use ← → or A/D. On mobile, tap the left or right side of the game.</p>
  </main>
  <script>
    const game = document.querySelector('#game');
    const player = document.querySelector('#player');
    const scoreEl = document.querySelector('#score');
    const bestEl = document.querySelector('#best');
    const start = document.querySelector('#start');
    let x = 0, score = 0, running = false, raf = 0, last = 0, spawn = 0;
    let best = Number(localStorage.getItem('sneak-commit-best') || 0);
    bestEl.textContent = best;

    function reset() {
      document.querySelectorAll('.commit').forEach(el => el.remove());
      x = (game.clientWidth - player.offsetWidth) / 2;
      player.style.left = `${x}px`;
      score = 0;
      scoreEl.textContent = score;
      last = performance.now();
      spawn = 0;
    }

    function makeCommit() {
      const el = document.createElement('div');
      el.className = 'commit';
      el.textContent = '✦';
      el.dataset.y = '-50';
      el.style.left = `${Math.random() * (game.clientWidth - 42)}px`;
      el.style.top = '-50px';
      game.appendChild(el);
    }

    function hit(a, b) {
      const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
      return ar.left < br.right && ar.right > br.left && ar.top < br.bottom && ar.bottom > br.top;
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min(32, now - last); last = now;
      spawn += dt;
      const interval = Math.max(250, 720 - score * 8);
      if (spawn > interval) { makeCommit(); spawn = 0; }
      document.querySelectorAll('.commit').forEach(el => {
        const y = Number(el.dataset.y) + dt * (0.22 + score * 0.004);
        el.dataset.y = y;
        el.style.top = `${y}px`;
        if (hit(player, el)) end();
        else if (y > game.clientHeight) { el.remove(); score++; scoreEl.textContent = score; }
      });
      raf = requestAnimationFrame(loop);
    }

    function end() {
      running = false;
      cancelAnimationFrame(raf);
      if (score > best) { best = score; localStorage.setItem('sneak-commit-best', best); bestEl.textContent = best; }
      start.textContent = `Game Over — ${score}. Play Again`;
    }

    function move(direction) {
      if (!running) return;
      x += direction * 42;
      x = Math.max(0, Math.min(game.clientWidth - player.offsetWidth, x));
      player.style.left = `${x}px`;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') move(-1);
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') move(1);
      if (e.key === ' ' && !running) start.click();
    });

    game.addEventListener('pointerdown', e => move(e.clientX < game.getBoundingClientRect().left + game.clientWidth / 2 ? -1 : 1));
    start.addEventListener('click', () => { reset(); running = true; start.textContent = 'Restart'; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); });
    reset();
  </script>
</body>
</html>
