name: Profile 3D contribution graph

on:
  schedule:
    - cron: "30 18 * * 0" # every Monday 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate 3D contribution graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep only the images the README uses
        run: |
          find profile-3d-contrib -type f \
            ! -name 'profile-green-animate.svg' \
            ! -name 'profile-night-green.svg' -delete

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git commit -m "chore(stats): refresh 3D contribution graph"; then
            git push
          fi
