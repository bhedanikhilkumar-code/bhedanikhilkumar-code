name: Repository Health

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-health:
    name: Documentation and structure check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.22.1 "*.md" "docs/*.md" ".github/*.md"

      - name: Validate professional repository files
        run: python scripts/validate_repository_health.py
