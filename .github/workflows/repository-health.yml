name: Repository Health

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-health:
    name: Documentation and structure check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.22.1 "*.md" "docs/*.md" ".github/*.md"

      - name: Validate professional repository files
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          required_files = [
              ".markdownlint.json",
              "README.md",
              "CONTRIBUTING.md",
              "SECURITY.md",
              "SUPPORT.md",
              "CODE_OF_CONDUCT.md",
              ".github/CODEOWNERS",
              ".github/PULL_REQUEST_TEMPLATE.md",
              ".github/ISSUE_TEMPLATE/bug_report.yml",
              ".github/ISSUE_TEMPLATE/feature_request.yml",
              "docs/ARCHITECTURE.md",
              "docs/CASE_STUDY.md",
              "docs/ROADMAP.md",
              "docs/QUALITY.md",
              "docs/PROJECT_SHOWCASE.md",
              "docs/PORTFOLIO_REVIEW_GUIDE.md",
              "docs/REVIEW_CHECKLIST.md",
          ]

          missing = [file for file in required_files if not Path(file).exists()]
          if missing:
              print("Missing professional repository files:")
              for file in missing:
                  print(f"- {file}")
              raise SystemExit(1)

          readme = Path("README.md").read_text(encoding="utf-8", errors="ignore")
          readme_checks = {
              "README has enough detail": len(readme) >= 1500,
              "README has H1": readme.startswith("# Nikhil Bheda"),
              "README has documentation hub": "Documentation Hub" in readme,
              "README links architecture": "docs/ARCHITECTURE.md" in readme,
              "README links roadmap": "docs/ROADMAP.md" in readme,
              "README links quality standard": "docs/QUALITY.md" in readme,
              "README links project showcase": "docs/PROJECT_SHOWCASE.md" in readme,
              "README links portfolio review guide": "docs/PORTFOLIO_REVIEW_GUIDE.md" in readme,
          }
          failed = [name for name, ok in readme_checks.items() if not ok]
          if failed:
              print("README quality checks failed:")
              for name in failed:
                  print(f"- {name}")
              raise SystemExit(1)

          markdown_files = (
              list(Path(".").glob("*.md"))
              + list(Path("docs").glob("*.md"))
              + list(Path(".github").glob("*.md"))
          )
          link_pattern = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          missing_links = []
          missing_images = []
          relative_images = []
          for file in markdown_files:
              text = file.read_text(encoding="utf-8", errors="ignore")
              for match in link_pattern.finditer(text):
                  href = match.group(1).strip()
                  if not href or href.startswith(("#", "http://", "https://", "mailto:")):
                      continue
                  target = href.split("#", 1)[0]
                  if not target:
                      continue
                  target_path = file.parent / target
                  is_image = match.group(0).startswith("!")
                  if is_image:
                      relative_images.append(target_path)
                  if not target_path.exists():
                      item = f"{file} -> {href}"
                      if is_image:
                          missing_images.append(item)
                      else:
                          missing_links.append(item)

          if missing_links or missing_images:
              if missing_links:
                  print("Missing relative Markdown links:")
                  for item in missing_links:
                      print(f"- {item}")
              if missing_images:
                  print("Missing relative Markdown images:")
                  for item in missing_images:
                      print(f"- {item}")
              raise SystemExit(1)

          for image in sorted(set(relative_images)):
              if image.suffix.lower() == ".svg":
                  svg = image.read_text(encoding="utf-8", errors="ignore")
                  if "<svg" not in svg or "</svg>" not in svg:
                      print(f"Invalid SVG asset: {image}")
                      raise SystemExit(1)

          forbidden_widget_sources = [
              "github-readme-stats.vercel.app",
              "streak-stats.demolab.com",
              "github-readme-activity-graph.vercel.app",
              "readme-typing-svg.herokuapp.com",
              "skillicons.dev",
              "komarev.com",
              "img.shields.io",
              "raw.githubusercontent.com/bhedanikhilkumar-code/bhedanikhilkumar-code/output/",
          ]
          forbidden_hits = []
          for file in markdown_files:
              text = file.read_text(encoding="utf-8", errors="ignore")
              for source in forbidden_widget_sources:
                  if source in text:
                      forbidden_hits.append(f"{file} -> {source}")

          if forbidden_hits:
              print("Forbidden flaky README/widget sources found:")
              for item in forbidden_hits:
                  print(f"- {item}")
              raise SystemExit(1)

          suspicious_names = {".env", ".env.local", ".env.production", "id_rsa", "id_ed25519"}
          suspicious = [str(path) for path in Path(".").rglob("*") if path.is_file() and path.name in suspicious_names]
          for path in suspicious:
              print(f"::warning file={path}::Review sensitive-looking tracked file")

          print("Repository health check passed.")
          PY
